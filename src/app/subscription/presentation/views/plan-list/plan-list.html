<app-shell [navigation]="navigation" breadcrumb="Cuenta › Planes"><div class="page"><h1>Planes disponibles</h1><p>Selecciona el plan que mejor se ajuste a tu operación.</p><div class="plans">@for(plan of store.plans();track plan.type){<article [class.current]="store.subscription()?.plan===plan.type"><h2>{{plan.name}}</h2><strong>{{plan.price}}</strong><p>{{plan.projects}} proyectos · {{plan.users}} usuarios</p><ul>@for(feature of plan.features;track feature){<li>{{feature}}</li>}</ul><button (click)="select(plan)">{{store.subscription()?.plan===plan.type?'Plan actual':'Cambiar a este plan'}}</button></article>}</div></div></app-shell>
