<app-shell [navigation]="navigation()" breadcrumb="Cuenta › Planes">
  <div class="page">
    <h1>Planes disponibles</h1>
    <p>Selecciona el plan que mejor se ajuste a tu operación.</p>
    <div class="plans">
      @for (plan of store.plans(); track plan.type) {
        <article [class.current]="store.subscription()?.plan.id === plan.id">
          <h2>{{ plan.name }}</h2>
          <p>{{ plan.description }}</p>
          <ul>
            <li>Proyectos: {{ plan.maxProjects ?? 'Sin límite' }}</li>
            <li>Usuarios: {{ plan.maxUsers ?? 'Sin límite' }}</li>
          </ul>
          <button
            [disabled]="
              !canChangePlan() || store.subscription()?.plan.id === plan.id || !plan.active
            "
            (click)="select(plan)"
          >
            @if (store.subscription()?.plan.id === plan.id) {
              Plan actual
            } @else if (canChangePlan()) {
              Cambiar a este plan
            } @else {
              Solo administradores pueden cambiar el plan
            }
          </button>
        </article>
      }
    </div>
  </div>
</app-shell>
