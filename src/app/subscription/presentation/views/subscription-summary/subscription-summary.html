<app-shell [navigation]="navigation()" breadcrumb="Cuenta › Suscripción"
  ><div class="page">
    @if (store.subscription(); as subscription) {
      <h1>Tu suscripción</h1>
      <p>Administra tu plan y sus límites operativos.</p>
      <section>
        <div>
          <small>PLAN ACTUAL</small>
          <h2>{{ subscription.plan }}</h2>
          <span>{{ subscription.status === 'ACTIVE' ? 'Activa' : 'Requiere atención' }}</span>
          <p>Renueva el {{ subscription.renewalDate }}</p>
          <a routerLink="/subscription/plans">Ver planes</a>
        </div>
      </section>
    }
  </div></app-shell
>
