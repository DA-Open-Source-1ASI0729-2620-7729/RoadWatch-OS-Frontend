<main><section><img src="/brand/RoadWatchLogo.jpeg" alt="RoadWatch OS"/><p class="eyebrow">MONITOREO AMBIENTAL</p><h1>Detecta la desviación antes de la multa.</h1><p>Gestiona proyectos, evidencias y cumplimiento ambiental desde un solo lugar.</p></section><form (submit)="$event.preventDefault();submit()"><h2>Iniciar sesión</h2><p>Ingresa con tu correo corporativo.</p><label>Correo electrónico<input type="email" [value]="email()" (input)="email.set($any($event.target).value)"/></label><label>Contraseña<input type="password" [value]="password()" (input)="password.set($any($event.target).value)"/></label>@if(store.error()){<small class="error">{{store.error()}}</small>}<button [disabled]="store.loading()">{{store.loading()?'Ingresando...':'Ingresar'}}</button><small>Acceso protegido por roles y permisos.</small></form></main>
